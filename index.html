<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artillery Roguelike</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #333;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            cursor: crosshair;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }
        
        #upgradeModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #555;
            padding: 20px;
            border-radius: 10px;
            display: none;
            pointer-events: all;
            text-align: center;
        }

        #upgradeModal h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        #upgradePlayerIndicator {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .upgrade-option {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .upgrade-option:hover {
            background: #555;
        }
        
        #playerInfo {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .player-status {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
        }
        
        .player-active {
            background: rgba(0, 100, 200, 0.7);
        }
        
        #aimingInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="600"></canvas>
        <div id="ui">
            <div id="playerInfo">
                <div class="player-status" id="player1Status">
                    Player 1 - HP: <span id="p1hp">100</span>
                </div>
                <div class="player-status" id="player2Status">
                    Player 2 - HP: <span id="p2hp">100</span>
                </div>
            </div>
            <div id="aimingInfo">
                Angle: <span id="aimAngle">0</span>° | Power: <span id="aimPower">0</span>%
            </div>
        </div>
        <div id="upgradeModal">
            <div id="upgradePlayerIndicator"></div>
            <h3>Choose an Upgrade</h3>
            <div id="upgradeOptions"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.158.0",
            "cannon": "https://esm.sh/cannon@0.20.0"
        }
    }
    </script>

    <script type="module" src="core/game.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
