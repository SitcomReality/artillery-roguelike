<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artillery Roguelike</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #333;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            cursor: crosshair;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }
        
        #upgradeModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #555;
            padding: 20px;
            border-radius: 10px;
            display: none;
            pointer-events: all;
            text-align: center;
        }

        #upgradeModal h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        #upgradePlayerIndicator {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .upgrade-option {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }
        
        .upgrade-option:hover {
            background: #555;
        }
        
        #playerInfo {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .player-status {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
        }
        
        .player-active {
            background: rgba(0, 100, 200, 0.7);
        }
        
        #aimingInfo {
            display: none;
        }
        
        /* New aiming indicator styling */
        .aim-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
        
        .angle-indicator {
            border: 2px solid rgba(255, 255, 0, 0.8);
            border-radius: 50%;
        }
        
        .angle-indicator::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 3px;
            background: rgba(255, 255, 0, 0.9);
            transform-origin: left center;
            transform: rotate(var(--aim-angle, 0deg)) translateY(-50%);
            transition: transform 0.1s ease-out;
        }
        
        .power-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }
        
        .power-gauge {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .power-fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #FFEB3B, #F44336);
            width: 0%;
            transition: width 0.1s ease-out;
        }
        
        .player-status.player-active {
            position: relative;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="600"></canvas>
        <div id="ui">
            <div id="playerInfo">
                <div class="player-status" id="player1Status">
                    Player 1 - HP: <span id="p1hp">100</span>
                </div>
                <div class="player-status" id="player2Status">
                    Player 2 - HP: <span id="p2hp">100</span>
                </div>
            </div>
            <div id="aimingInfo">
                Angle: <span id="aimAngle">0</span>° | Power: <span id="aimPower">0</span>%
            </div>
        </div>
        <div id="upgradeModal">
            <div id="upgradePlayerIndicator"></div>
            <h3>Choose an Upgrade</h3>
            <div id="upgradeOptions"></div>
        </div>
        <!-- Add aiming indicators for each player -->
        <div class="aim-indicator angle-indicator" id="p1Angle"></div>
        <div class="aim-indicator power-indicator" id="p1Power"></div>
        <div class="aim-indicator angle-indicator" id="p2Angle"></div>
        <div class="aim-indicator power-indicator" id="p2Power"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.158.0",
            "cannon": "https://esm.sh/cannon@0.20.0"
        }
    }
    </script>

    <script type="module" src="core/game.js"></script>
</body>
</html>
